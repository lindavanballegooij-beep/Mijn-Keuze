<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mijn Keuze</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #263238;
    }

    .app {
      max-width: 1200px;
      margin: auto;
      padding: 35px 20px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 38px;
      margin: 5px 0;
    }

    .subtitle {
      font-size: 22px;
      margin-bottom: 35px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 100px;
    }

    .choice {
      background: white;
      border-radius: 25px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.10);
      transition: transform 0.15s;
    }

    .choice:active {
      transform: scale(0.97);
    }

    .choice img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
    }

    .choice-name {
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .app {
        padding: 25px 15px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 20px;
      }

      .choices {
        gap: 12px;
      }

      .choice img {
        height: 180px;
      }

      .choice-name {
        font-size: 21px;
        padding: 15px 5px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>Mijn Keuze</h1>

    <div class="subtitle">
      Wat wil je kijken?
    </div>

    <div class="choices">

      <!-- KEUZE 1 -->
      <div class="choice"
           onclick="openVideo('https://www.youtube.com/watch?v=0JEwPNxC4QU&t=15s')">

        <img
          src="nijntjeboerderij.jpg"
          alt="Filmpje 1">

        <div class="choice-name">
          Nijntje
        </div>

      </div>


      <!-- KEUZE 2 -->
      <div class="choice"
           onclick="openVideo('https://www.youtube.com/watch?v=sqqPPE8CZYw')">

        <img
          src="peppapignl.jpg"
          alt="Filmpje 2">

        <div class="choice-name">
          Peppa Pig
        </div>

      </div>

    </div>

  </main>


  <script>
    function openVideo(url) {
      window.location.href = url;
    }
  </script>

</body>
</html>
